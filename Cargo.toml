[package]
name = "auto-typer"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/flyflyk/Auto-Typer"

[dependencies]
eframe = "0.33"
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
self-replace = "1.5"
ureq = { version = "2.12", features = ["json"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.17"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
strip = true
